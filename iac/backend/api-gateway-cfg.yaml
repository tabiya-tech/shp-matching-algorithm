      responses:
        '200':
          description: Match recommendations
        '400':
          description: Bad Request - invalid payload
        '429':
          description: Too Many Requests - rate limit exceeded
        '500':
          description: Internal Server Error
      summary: Match users to opportunities
      tags:
        - Matching
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: [ ]
    options:
      description: CORS preflight for /match
      operationId: match_options_v2
      responses:
        '200':
          description: Success
      tags:
