swagger: '2.0'

info:
  description: Matching API __ENVIRONMENT__
  title: Matching API __ENVIRONMENT__
  version: 1.0.0

x-google-backend:
  address: __CLOUD_RUN_URL__
  deadline: 300

schemes:
  - https

produces:
  - application/json

consumes:
  - application/json

securityDefinitions:
  gcp_api_key:
    type: apiKey
    name: "x-api-key"
    in: "header"
    description: "Google Cloud API key for authentication"

x-google-management:
  metrics:
    - name: "request-metric"
      displayName: "API Request Counter"
      valueType: INT64
      metricKind: DELTA
      description: "Counts the number of API requests"
  quota:
    limits:
      - name: "request-limit"
        metric: "request-metric"
        unit: "1/min/{project}"
        values:
          STANDARD: 12000

paths:
  '/docs':
    get:
      summary: Docs endpoint
      operationId: api_docs
      responses:
        '200':
          description: Docs page
          schema:
            type: string
  '/openapi.json':
    get:
      summary: OAS file
      operationId: oas_file
      responses:
        '200':
          description: OAS file
          schema:
            type: string
  '/health':
    get:
      summary: Get Health of the service
      operationId: get_health
      responses:
        '200':
          description: Status of the application
          schema:
            type: string
  '/jobs':
    get:
      description: Browse active jobs with cursor-based pagination. Reads from the same data source as matched jobs.
      operationId: list_jobs
      parameters:
        - name: cursor
          in: query
          required: false
          type: string
          description: Opaque pagination cursor returned as next_cursor by the previous response. Omit for the first page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Page size (1-100). Default 20.
      responses:
        '200':
          description: A page of jobs (items + next_cursor)
        '400':
          description: Bad Request - invalid cursor
        '429':
          description: Too Many Requests - rate limit exceeded
        '500':
          description: Internal Server Error
      summary: Browse jobs
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
    options:
      description: CORS preflight for /jobs
      operationId: jobs_options
      responses:
        '200':
          description: Success
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
  '/jobs/stats':
    get:
      description: Get the stats of different jobs
      operationId: list_jobs_stats
      responses:
        '200':
          description: Stats of jobs
      summary: Browse jobs stats
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
    options:
      description: CORS preflight for /jobs
      operationId: jobs_stats_options
      responses:
        '200':
          description: Success
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
  '/match':
    post:
      description: Match one or many users against jobs and occupations.
      operationId: match
      parameters:
        - name: body
          in: body
          required: true
          description: User(s) to match. Single object or array of MatchRequest.
          schema:
            type: object
            description: MatchRequest or array of MatchRequest
      responses:
        '200':
          description: Match recommendations
        '400':
          description: Bad Request - invalid payload
        '429':
          description: Too Many Requests - rate limit exceeded
        '500':
          description: Internal Server Error
      summary: Match users to opportunities
      tags:
        - Matching
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
  '/experiments/v2/match':
